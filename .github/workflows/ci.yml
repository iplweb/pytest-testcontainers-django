name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check src tests
          ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        pytest-version: ["7", "8", "9"]
        exclude:
          # pytest 7.4.x has no Python 3.13 support (added in pytest 8.3).
          # Keep in sync with the envlist exclusion in tox.ini.
          - python-version: "3.13"
            pytest-version: "7"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3

      - name: Run unit tests via tox
        env:
          PYVER: ${{ matrix.python-version }}
          PYTESTVER: ${{ matrix.pytest-version }}
        run: |
          uvx --with tox-uv tox -e "py${PYVER//./}-pytest${PYTESTVER}"

  # Narrow Django axis. The `test` matrix is a pytest matrix and stays that
  # way — Django is only a dev dependency here — but a few tests do touch
  # Django internals, and pyproject advertises `Framework :: Django :: 6.1`.
  # This single job pins that claim to something that actually runs.
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          # Django 6.0/6.1 require Python >=3.12.
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3

      - name: Run unit tests against Django 6.1
        run: |
          uvx --with tox-uv tox -e django61
