name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token is stored
# anywhere. PyPI verifies a short-lived token minted by GitHub for this exact
# repository + workflow file + environment, so the trusted-publisher entry on
# PyPI must match all three:
#
#   Owner:       iplweb
#   Repository:  pytest-testcontainers-django
#   Workflow:    release.yml
#   Environment: pypi
#
# Renaming this file, or dropping `environment: pypi` below, breaks publishing
# until the PyPI entry is updated to match.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only — do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Default is to leave the job token in .git/config; anything that
          # later archives the workspace would ship it. Nothing here needs
          # to push, so drop it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          # Off on purpose, and stated explicitly rather than left to the
          # action's default: a poisoned cache entry would end up inside a
          # published artifact, and a release runs rarely enough that the
          # saved seconds are not worth that.
          enable-cache: false
      # `ci.yml` lints on 3.12 and runs the pytest matrix through tox. A tag
      # only lands on main, which those jobs already gated; this re-runs the
      # cheap half so a release can never reach PyPI with the suite red.
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev]'
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest tests -q

  build:
    name: Build + check artifacts
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Default is to leave the job token in .git/config; anything that
          # later archives the workspace would ship it. Nothing here needs
          # to push, so drop it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          # Off on purpose, and stated explicitly rather than left to the
          # action's default: a poisoned cache entry would end up inside a
          # published artifact, and a release runs rarely enough that the
          # saved seconds are not worth that.
          enable-cache: false

      # A tag that disagrees with pyproject.toml would publish a version nobody
      # can trace back to a commit. Cheap to check, painful to undo — PyPI does
      # not allow re-uploading a version.
      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(uv version --short)"
          if [ "$GIT_TAG" != "v${PROJECT_VERSION}" ]; then
            echo "::error::tag ${GIT_TAG} != pyproject version ${PROJECT_VERSION}"
            exit 1
          fi
          echo "tag ${GIT_TAG} matches pyproject version ${PROJECT_VERSION}"

      - run: uv build
      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    # Must match the Environment field of the PyPI trusted publisher. Also the
    # place to add a required reviewer if you ever want releases gated.
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-testcontainers-django
    permissions:
      # The whole point: lets GitHub mint the OIDC token PyPI exchanges for a
      # scoped, short-lived upload token. No secret in the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
