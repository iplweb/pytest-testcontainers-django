[tox]
# Matrix: Python 3.10-3.13 x pytest {7,8,9}.
# pytest 7.4.x has no Python 3.13 support (pytest gained 3.13 in 8.3), so the
# py313-pytest7 cell is intentionally absent below. Keep this exclusion in sync
# with the matrix `exclude` in .github/workflows/ci.yml.
envlist =
    py{310,311,312,313}-pytest{8,9}
    py{310,311,312}-pytest7
requires =
    tox-uv>=1
isolated_build = true

[testenv]
# uv-venv-runner installs via `uv pip` (no uv.lock required); this is a library,
# not a lockfile-managed app, so we don't use uv-venv-lock-runner.
runner = uv-venv-runner
extras = dev
# Factor-conditional pin selects the pytest major. This explicit constraint
# wins over the resolution pulled in by the `dev` extra (compatible with the
# project's own `pytest >=7.4,<10` cap).
deps =
    pytest7: pytest>=7.4,<8
    pytest8: pytest>=8,<9
    pytest9: pytest>=9,<10
# Mirror CI's unit-test run: containers disabled, so no Docker daemon needed.
setenv =
    PYTEST_TESTCONTAINERS_DISABLE = 1
    PYTEST_TESTCONTAINERS = 0
commands =
    pytest -v {posargs}
