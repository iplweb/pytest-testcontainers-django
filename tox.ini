[tox]
# Matrix: Python 3.10-3.13 x pytest {7,8,9}.
# pytest 7.4.x has no Python 3.13 support (pytest gained 3.13 in 8.3), so the
# py313-pytest7 cell is intentionally absent below. Keep this exclusion in sync
# with the matrix `exclude` in .github/workflows/ci.yml.
#
# Additionally a single, narrow Django cell (`django61`) pins the newest
# Django series this package advertises in its trove classifiers, so that
# claim has something verifying it.  See [testenv:django61].
envlist =
    py{310,311,312,313}-pytest{8,9}
    py{310,311,312}-pytest7
    django61
requires =
    tox-uv>=1
isolated_build = true

[testenv]
# uv-venv-runner installs via `uv pip` (no uv.lock required); this is a library,
# not a lockfile-managed app, so we don't use uv-venv-lock-runner.
runner = uv-venv-runner
extras = dev
# Factor-conditional pin selects the pytest major. This explicit constraint
# wins over the resolution pulled in by the `dev` extra (compatible with the
# project's own `pytest >=7.4,<10` cap).
deps =
    pytest7: pytest>=7.4,<8
    pytest8: pytest>=8,<9
    pytest9: pytest>=9,<10
# Mirror CI's unit-test run: containers disabled, so no Docker daemon needed.
setenv =
    PYTEST_TESTCONTAINERS_DISABLE = 1
    PYTEST_TESTCONTAINERS = 0
commands =
    pytest -v {posargs}

# The main matrix leaves Django floating (the `dev` extra only says
# `django >=4.2`), so which series gets exercised depends on what uv happens
# to resolve.  This env pins it: Django 6.1 on Python 3.13, the newest series
# the classifiers advertise.  It is what actually covers the handful of tests
# that touch Django internals (`django.conf.empty`, `LazySettings._wrapped`,
# `AppRegistryNotReady`) in `tests/test_plugin.py`.
# Django 6.0/6.1 require Python >=3.12, hence base_python.
[testenv:django61]
base_python = py313
deps =
    Django~=6.1.0
